substitutions:
  device_name: extractor-trastero

packages:
  device_base: !include base_devices/sonoffbasicr2.yaml

esphome:
  friendly_name: Extractor trastero
  area: trastero

fan:
  - platform: binary
    name: Ventilador
    id: fan_1
    output: relay_1
    restore_mode: RESTORE_DEFAULT_OFF

binary_sensor:
  - id: !extend button_1
    on_press:
      then:
      - fan.toggle: fan_1