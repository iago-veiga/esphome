substitutions:
  device_name: comedero-gato

packages:
  device_base: !include base_devices/esp32c3.yaml
  logger_tuya: !include common/logger_tuya_debug.yaml

esphome:
  friendly_name: Comedero gatos
  area: cocina
  includes:
    - common/cpp/mealplan_codec.h
  on_boot:
    priority: 600
    then:
      - lambda: |-
          if (id(last_feed_date_global) > 0) {
            id(last_feed_date).publish_state(id(last_feed_date_global));
          }
          if (id(last_feed_portions_global) > 0) {
            id(last_feed_portions).publish_state(id(last_feed_portions_global));
          }
          id(problem).publish_state(id(bitmask_val) != 0);
          id(low_food).publish_state((id(bitmask_val) & 0x02) != 0);
          char buf[11];
          snprintf(buf, sizeof(buf), "0x%08X", (unsigned int) id(bitmask_val));
          id(dp13_fault_flags).publish_state(buf);

uart:
  tx_pin: GPIO21
  rx_pin: GPIO20
  baud_rate: 9600
  id: uart_bus

tuya:
  time_id: sntp_time
  on_datapoint_update:
    - sensor_datapoint: 1
      datapoint_type: raw
      then:
        - lambda: |-
            // DP1 suele ser meal_plan (raw/complex protocol).
            // Publicamos el payload en HEX para poder analizarlo.
            std::string hex;
            hex.reserve(x.size() * 2);
            char buf[3];
            for (uint8_t b : x) {
              snprintf(buf, sizeof(buf), "%02X", b);
              hex += buf;
            }
            id(dp1_meal_plan_raw).publish_state(hex);
            // Mantén la entidad base64 en sync con lo que reporta el MCU.
            id(meal_plan_b64).publish_state(mealplan_codec::base64_encode(x));
            ESP_LOGD("pet_feeder", "DP1 meal_plan raw: %s", hex.c_str());
    - sensor_datapoint: 13
      datapoint_type: bitmask
      then:
        - lambda: |-
            id(bitmask_val) = x;
            id(problem).publish_state(id(bitmask_val) != 0);
            id(low_food).publish_state((id(bitmask_val) & 0x02) != 0);
            char buf[11];
            snprintf(buf, sizeof(buf), "0x%08X", (unsigned int) id(bitmask_val));
            id(dp13_fault_flags).publish_state(buf);
            ESP_LOGD("pet_feeder", "DP13 fault flags: %s", buf);
    - sensor_datapoint: 4
      datapoint_type: enum
      then:
        - lambda: |-
            uint8_t enum_value = x;
            if (enum_value == 0) {
              id(text_sensor_state).publish_state("standby");
            } else if (enum_value == 1){
              id(text_sensor_state).publish_state("feeding");
            } else if (enum_value == 2){
              id(text_sensor_state).publish_state("done");
              if (id(quick_feed).state) {
                id(quick_feed).turn_off();
              }
            } else {
              id(text_sensor_state).publish_state("unknown");
            }
    - sensor_datapoint: 14
      datapoint_type: int
      then:
        - lambda: |-
            const auto now = id(sntp_time).now();
            if (now.is_valid()) {
              id(last_feed_date_global) = now.timestamp;
              id(last_feed_date).publish_state(id(last_feed_date_global));
            }
            id(last_feed_portions_global) = x;
            id(last_feed_portions).publish_state(x);

binary_sensor:
  - platform: template
    name: Error General
    id: problem
    device_class: problem
    lambda: |-
      return id(bitmask_val) != 0;
  - platform: template
    name: Poca comida
    id: low_food
    device_class: problem
    lambda: |-
      return (id(bitmask_val) & 0x02) != 0;

button:
  - platform: template
    name: Feed
    id: feed_button
    on_press:
      then:
        - script.execute: feed_script
  - platform: template
    name: Alimentación rápida
    id: quick_feed_button
    on_press:
      - lambda: |-
          id(quick_feed).turn_on();

  - platform: template
    name: Borrar meal plan (DP1)
    id: clear_meal_plan_button
    entity_category: config
    on_press:
      then:
        - lambda: |-
            // Intentamos borrar enviando payload vacío.
            // Si el MCU no lo acepta, puedes probar manualmente con "00".
            id(meal_plan_b64).publish_state("");
        - script.execute: send_meal_plan_dp1_b64

text:
  - platform: template
    name: Meal plan (base64)
    id: meal_plan_b64
    entity_category: config
    optimistic: true
    restore_value: true
    initial_value: ""
    mode: text
    set_action:
      - lambda: |-
          // Persistimos el nuevo valor para que el card vea el cambio inmediatamente.
          id(meal_plan_b64).publish_state(x);
      - script.execute: send_meal_plan_dp1_b64

globals:
  - id: last_feed_date_global
    type: int
    restore_value: true
    initial_value: "0"
  - id: last_feed_portions_global
    type: int
    restore_value: true
    initial_value: "0"
  - id: bitmask_val
    type: uint32_t
    restore_value: no
    initial_value: '0'

light:
  - platform: tuya
    name: Led
    switch_datapoint: 17
    restore_mode: RESTORE_DEFAULT_ON

number:
  - platform: template
    name: Porciones
    id: portions
    mode: BOX
    optimistic: True
    min_value: 1
    max_value: 12
    step: 1
    restore_value: True
  - platform: tuya
    name: feed
    id: feed
    max_value: 12
    min_value: 1
    step: 1
    number_datapoint: 3
    datapoint_hidden:
      datapoint_type: int
    internal: True

sensor:
  - platform: tuya
    name: Batería auxiliar
    device_class: battery
    unit_of_measurement: '%'
    accuracy_decimals: 0
    id: battery
    sensor_datapoint: 10

  - platform: tuya
    id: feed_state
    sensor_datapoint: 4
    name: DP4 raw
    entity_category: diagnostic
    disabled_by_default: true

  - platform: template
    name: Porcion ultima comida
    id: last_feed_portions
    icon: mdi:counter

  - platform: template
    name: Ultima comida
    id: last_feed_date
    device_class: timestamp
    icon: mdi:calendar-clock

select:
  - platform: template
    name: Modo de Alimentación
    id: feeding_mode
    optimistic: false
    options:
      - Normal
      - Lento
    lambda: |-
      if (id(slow_feed).state) {
        return {"Lento"};
      } else {
        return {"Normal"};
      }
    set_action:
      - lambda: |-
          if (x == "Normal") {
            id(slow_feed).turn_off();
          } else if (x == "Lento") {
            id(slow_feed).turn_on();
          }

script:
  - id: feed_script
    then:
      - lambda: |-
          int p = (int) roundf(id(portions).state);
          if (p <= 1) {
            // En este modelo, 1 porción suele funcionar mejor con quick_feed (DP2)
            // que enviando manual_feed=1 (DP3).
            id(quick_feed_button).press();
            return;
          }

          // Rango típico del DP manual_feed en estos comederos: 1..12.
          if (p > 12) p = 12;

          auto call = id(feed).make_call();
          call.set_value(p);
          call.perform();

  - id: send_meal_plan_dp1_b64
    mode: queued
    then:
      - lambda: |-
          // Integra directamente con mealplan-card: el card escribe un string base64
          // al entity (típicamente dominio "text"), y aquí lo convertimos a bytes.
          const std::string s = id(meal_plan_b64).state;

          std::vector<uint8_t> payload;
          std::string err;
          if (!mealplan_codec::base64_decode(s, &payload, &err)) {
            ESP_LOGW("pet_feeder", "Meal plan base64 inválido: %s", err.c_str());
            return;
          }

          // Construir frame Tuya MCU: SET_DP (0x06)
          const uint8_t dp_id = 0x01;
          const uint8_t dp_type_raw = 0x00;
          const uint16_t data_len = (uint16_t) payload.size();
          const uint16_t len = (uint16_t) (4 + data_len);

          std::vector<uint8_t> frame;
          frame.reserve(2 + 1 + 1 + 2 + len + 1);
          frame.push_back(0x55);
          frame.push_back(0xAA);
          frame.push_back(0x00); // version
          frame.push_back(0x06); // command: set dp
          frame.push_back((uint8_t) (len >> 8));
          frame.push_back((uint8_t) (len & 0xFF));
          frame.push_back(dp_id);
          frame.push_back(dp_type_raw);
          frame.push_back((uint8_t) (data_len >> 8));
          frame.push_back((uint8_t) (data_len & 0xFF));
          frame.insert(frame.end(), payload.begin(), payload.end());

          uint8_t checksum = 0;
          for (uint8_t b : frame) checksum += b;
          frame.push_back(checksum);

          ESP_LOGI("pet_feeder", "Enviando DP1 meal_plan raw desde base64 (%u bytes)", (unsigned) payload.size());
          id(uart_bus).write_array(frame.data(), frame.size());
text_sensor:
  - platform: template
    id: dp1_meal_plan_raw
    name: DP1 meal plan raw
    entity_category: diagnostic
    disabled_by_default: true

  - platform: template
    id: dp13_fault_flags
    name: DP13 fault flags
    entity_category: diagnostic
    disabled_by_default: true

  - platform: template
    id: text_sensor_state
    name: Estado

switch:
  - platform: template
    id: switch_1
    name: Comedero
    optimistic: True
    restore_mode: RESTORE_DEFAULT_ON
  - platform: tuya
    name: Alimentación lenta
    id: slow_feed
    switch_datapoint: 23
    internal: True
  - platform: tuya
    name: Alimentación rápida
    id: quick_feed
    switch_datapoint: 2
    internal: True

