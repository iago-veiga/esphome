substitutions:
  device_name: comedero-gato

packages:
  device_base: !include base_devices/esp32c3.yaml

esphome:
  friendly_name: Comedero Simba
  area: cocina

uart:
  tx_pin: GPIO21
  rx_pin: GPIO20
  baud_rate: 9600

tuya:
  time_id: sntp_time
  on_datapoint_update:
    - sensor_datapoint: 13
      datapoint_type: bitmask
      then: 
        - lambda: |-
            uint32_t bitmask_value = x;
            if (bitmask_value != 0) {
              id(problem).publish_state(true);
            } else {
              id(problem).publish_state(false);
            }
    - sensor_datapoint: 4
      datapoint_type: enum
      then:
        - lambda: |-
            uint8_t enum_value = x;
            if (enum_value == 0) {
              id(text_sensor_state).publish_state("standby");
            } else if (enum_value == 1){
              id(text_sensor_state).publish_state("feeding");
            } else if (enum_value == 2){
              id(text_sensor_state).publish_state("done");
              if (id(quick_feed).state) {
                id(quick_feed).turn_off();
              }
            } else {
              id(text_sensor_state).publish_state("unknown");
            }
    - sensor_datapoint: 14
      datapoint_type: int
      then: 
        - script.execute: set_last_feed_date_script
        - lambda: |-
            id(last_feed_portions).publish_state(x);
    - sensor_datapoint: 13
      datapoint_type: bitmask
      then:
        - lambda: |-
            id(bitmask_val) = x;
            ESP_LOGD("custom", "Valor de bitmask en datapoint 23: %u", bitmask_val);

binary_sensor:
  - platform: template
    name: Error General
    id: problem
    device_class: problem
    lambda: |-
      return id(bitmask_val) != 0;
  - platform: template
    name: Poca comida
    id: low_food
    device_class: problem
    lambda: |-
      return (id(bitmask_val) & 0x02) != 0;

button:
  - platform: template
    name: Feed
    id: feed_button
    on_press: 
      then:
        - script.execute: feed_script
        - script.execute: set_next_feed_time_script
  - platform: template
    name: Alimentación rápida
    id: quick_feed_button
    on_press:
      - lambda: |-
          id(quick_feed).turn_on();

datetime:
  - platform: template
    id: next_feed_time
    name: Hora siguiente comida
    type: time
    initial_value: "10:00:00"
    optimistic: True
    restore_value: True
    on_time:
      - if:
          condition:
            switch.is_on: switch_1
          then: 
            - script.execute: feed_script
      - script.execute: set_next_feed_time_script

globals:
  - id: last_feed_date_global
    type: int
    restore_value: true
    initial_value: "0"
  - id: bitmask_val
    type: uint32_t
    restore_value: no
    initial_value: '0'

light:
  - platform: tuya
    name: Led
    switch_datapoint: 17
    restore_mode: RESTORE_DEFAULT_ON

number:
  - platform: template
    name: Porciones
    id: portions
    mode: BOX
    optimistic: True
    min_value: 1
    max_value: 20
    step: 1
    restore_value: True
  - platform: template
    name: Comidas al dia
    id: feeds_at_day
    optimistic: True
    mode: BOX
    min_value: 1
    max_value: 5
    step: 1
    restore_value: True
  - platform: tuya
    name: feed
    id: feed
    max_value: 20
    min_value: 2
    step: 1
    number_datapoint: 3
    datapoint_hidden:
      datapoint_type: int
    internal: True

sensor:
  - platform: tuya
    name: Batería auxiliar
    device_class: battery
    id: battery
    sensor_datapoint: 10
  - platform: tuya
    id: feed_state
    sensor_datapoint: 4    
  - platform: template
    name: Porcion ultima comida
    id: last_feed_portions
    icon: mdi:counter
  - platform: template
    name: Ultima comida
    id: last_feed_date
    device_class: timestamp
    icon: mdi:calendar-clock
    lambda: |-
      if(id(last_feed_date_global) > 0){
        return id(last_feed_date_global);
      } else {
        return {};
      }

select:
  - platform: template
    name: Modo de Alimentación
    id: feeding_mode
    optimistic: false
    options:
      - Normal
      - Lento
    lambda: |-
      if (id(slow_feed).state) {
        return {"Lento"};
      } else {
        return {"Normal"};
      }
    set_action:
      - lambda: |-
          if (x == "Normal") {
            id(slow_feed).turn_off();
          } else if (x == "Lento") {
            id(slow_feed).turn_on();
          }

script:
  - id: feed_script
    then:
      - lambda: |-
          if (id(portions).state == 1) {
            id(quick_feed_button).press();
          }else{
            auto call = id(feed).make_call();
            call.set_value(int(id(portions).state));
            call.perform();
          }
  - id: set_next_feed_time_script
    then: 
      - lambda: |-
          int feeds_per_day = id(feeds_at_day).state;
          time_t seconds_between_feeds = (24 * 60 * 60) / feeds_per_day;
          time_t now = id(sntp_time).now().timestamp;
          time_t future_feed_time = now + seconds_between_feeds;
          struct tm * timeinfo = localtime(&future_feed_time);
          char buffer[8];
          strftime(buffer, sizeof(buffer), "%H:%M:%S", timeinfo);
          auto call = id(next_feed_time).make_call();
          call.set_time(buffer);
          call.perform();
  - id: set_last_feed_date_script
    then:
      - lambda: |-
          // Obtener el tiempo actual como un timestamp
          time_t now = id(sntp_time).now().timestamp;
          
          // Publicar el timestamp directamente en el sensor 'last_feed_date'
          id(last_feed_date_global) = now;

text_sensor:
  - platform: template
    id: text_sensor_state
    name: Estado

switch:
  - platform: template
    id: switch_1
    name: Comedero
    optimistic: True
    restore_mode: RESTORE_DEFAULT_ON
  - platform: tuya
    name: Alimentación lenta
    id: slow_feed
    switch_datapoint: 23
    internal: True
  - platform: tuya
    name: Alimentación rápida
    id: quick_feed
    switch_datapoint: 2
    internal: True
