substitutions:
  device_name: mesa-estudio

packages:
  device_base: !include base_devices/sonoffbasicr2.yaml

esphome:
  friendly_name: Mesa estudio
  area: estudio

switch:
  - platform: output
    name: Enchufe
    id: switch_1
    output: relay_1
    restore_mode: ALWAYS_ON

binary_sensor:
  - id: !extend button_1
    on_press:
      then:
      - switch.toggle: switch_1