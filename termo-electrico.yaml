substitutions:
  device_name: termo-electrico

packages:
  device_base: !include base_devices/esp12f.yaml
  logger_tuya: !include common/logger_tuya_warn.yaml

external_components:
  - source: github://pr#17323
    components: [tuya]
    refresh: 1h

esphome:
  friendly_name: Termo
  comment: Control ESP8266 con MCU Tuya del termo eléctrico.
  area: cocina

uart:
  tx_pin: GPIO1
  rx_pin: GPIO3
  baud_rate: 9600
  id: uart_bus
  rx_buffer_size: 256

globals:
  - id: last_dp101
    type: int
    restore_value: no
    initial_value: "-1"

tuya:
  time_id: sntp_time
  on_datapoint_update:
    - sensor_datapoint: 101
      datapoint_type: enum
      then:
        - lambda: |-
            if (id(last_dp101) != (int) x) {
              id(last_dp101) = (int) x;
              ESP_LOGW("termo_dp", "DP101 (enum) -> %d", (int) x);
            }
            id(termo_dp_101_raw).publish_state(x);

# Termo eléctrico con MCU Tuya expuesto como water_heater nativo.
#   DP1  (bool) -> on/off
#   DP2  (int)  -> temperatura objetivo
#   DP3  (int)  -> temperatura actual
#   DP4  (enum) -> modo: 0=SMART, 1=TIMER, 2=STD
# Mapeo: SMART -> ECO, STD -> ELECTRIC. TIMER queda fuera del water_heater
# (se puede seguir viendo/ajustando con el select de abajo).
water_heater:
  - platform: tuya
    id: termo
    name: Termo
    icon: mdi:water-boiler
    switch_datapoint: 1
    current_temperature_datapoint: 3
    target_temperature_datapoint: 2
    mode_datapoint: 4
    eco_value: 0
    electric_value: 2
    supported_modes:
      - "OFF"
      - ECO
      - ELECTRIC
    visual:
      min_temperature: 30
      max_temperature: 75
      target_temperature_step: 1

# DP101 resulta ser enum (según logs), así que usamos template para evitar warnings.
sensor:
  - platform: template
    name: "DP101 raw"
    id: termo_dp_101_raw
    accuracy_decimals: 0
    update_interval: never
    entity_category: diagnostic
    disabled_by_default: true

select:
  # Según tus pruebas:
  #  - 2 = STD
  #  - 1 = TIMER
  #  - 0 = SMART
  - platform: tuya
    name: "Modo"
    id: termo_mode
    enum_datapoint: 4
    optimistic: false
    options:
      0: SMART
      1: TIMER
      2: STD

binary_sensor:
  - platform: tuya
    name: "DP104 raw"
    id: termo_dp_104
    sensor_datapoint: 104
    entity_category: diagnostic
    disabled_by_default: true
    on_press:
      then:
        - lambda: |-
            ESP_LOGW("termo_dp", "DP104 -> ON");
    on_release:
      then:
        - lambda: |-
            ESP_LOGW("termo_dp", "DP104 -> OFF");

  - platform: tuya
    name: "DP9 Fault Flags"
    id: termo_fault_flags
    sensor_datapoint: 9
    entity_category: diagnostic
    disabled_by_default: true
