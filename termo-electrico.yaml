substitutions:
  device_name: termo-electrico

packages:
  device_base: !include base_devices/esp12f.yaml

esphome:
  friendly_name: Termo
  area: cocina

uart:
  tx_pin: GPIO1
  rx_pin: GPIO3
  baud_rate: 9600
  id: uart_bus
  # rx_buffer_size: 256

tuya:
  time_id: sntp_time

climate:
  - platform: tuya
    id: termo
    name: Termo
    switch_datapoint: 1
    active_state:
      datapoint: 5
      heating_value: 0
    target_temperature_datapoint: 2
    current_temperature_datapoint: 3
    visual:
      min_temperature: 30
      max_temperature: 75
      temperature_step: 1
    icon: mdi:water-boiler

sensor:
  - platform: tuya
    name: "Termo - Modo Programado"
    id: termo_modo_programado
    sensor_datapoint: 4
  - platform: tuya
    name: "Termo - Unknown 101"
    id: termo_dp_101
    sensor_datapoint: 101
  - platform: tuya
    name: "Termo - Unknown 102"
    id: termo_dp_102
    sensor_datapoint: 102
  - platform: tuya
    name: "Termo - Unknown 103"
    id: termo_dp_103
    sensor_datapoint: 103

binary_sensor:
  - platform: tuya
    name: "Termo - Unknown 104"
    id: termo_dp_104
    sensor_datapoint: 104

  - platform: tuya
    name: "Termo - Fault Flags"
    id: termo_fault_flags
    sensor_datapoint: 9

