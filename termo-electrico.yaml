substitutions:
  device_name: termo-electrico

packages:
  device_base: !include base_devices/esp12f.yaml

esphome:
  friendly_name: Termo
  area: cocina

# Override local del logger (sin usar UART) para depurar Tuya sin
# interferir con la comunicación en GPIO1/GPIO3.
logger:
  baud_rate: 0
  initial_level: INFO
  logs:
    # Evita spam como "[tuya:156] MCU restarted" (sale a nivel INFO).
    # Si necesitas depurar datapoints puntualmente, cambia a DEBUG temporalmente.
    tuya: WARN

uart:
  tx_pin: GPIO1
  rx_pin: GPIO3
  baud_rate: 9600
  id: uart_bus
  rx_buffer_size: 256

tuya:
  time_id: sntp_time
  on_datapoint_update:
    - sensor_datapoint: 101
      datapoint_type: enum
      then:
        - lambda: |-
            id(termo_dp_101_raw).publish_state(x);

climate:
  - platform: tuya
    id: termo
    name: Termo
    switch_datapoint: 1
    active_state:
      datapoint: 5
      heating_value: 0
    target_temperature_datapoint: 2
    current_temperature_datapoint: 3
    visual:
      min_temperature: 30
      max_temperature: 75
      temperature_step: 1
    icon: mdi:water-boiler

sensor:
  # DP101 resulta ser enum (según logs), así que usamos template para evitar warnings.
  - platform: template
    name: "Unknown 101"
    id: termo_dp_101_raw
    accuracy_decimals: 0
    update_interval: never

datetime:
  # UI cómoda en Home Assistant (selector de hora).
  # Implementación conservadora:
  # - HA -> termo: set_action escribe DP102/DP103 (solo hora)
  # - termo -> HA: on_value del DP actualiza el estado del selector
  # Sin restore_value para evitar escrituras a flash.
  - platform: template
    type: time
    name: "Timer inicio"
    id: termo_timer_start_time
    optimistic: true
    initial_value: "00:00:00"
    set_action:
      then:
        - lambda: |-
            int h = x.hour;
            if (h < 0) h = 0;
            if (h > 23) h = 23;

            // Solo escribimos el DP si realmente cambia.
            if (!isnan(id(termo_timer_start_hour).state) && (int) roundf(id(termo_timer_start_hour).state) == h) {
              return;
            }
            auto call = id(termo_timer_start_hour).make_call();
            call.set_value(h);
            call.perform();

  - platform: template
    type: time
    name: "Timer fin"
    id: termo_timer_stop_time
    optimistic: true
    initial_value: "00:00:00"
    set_action:
      then:
        - lambda: |-
            int h = x.hour;
            if (h < 0) h = 0;
            if (h > 23) h = 23;

            // Solo escribimos el DP si realmente cambia.
            if (!isnan(id(termo_timer_stop_hour).state) && (int) roundf(id(termo_timer_stop_hour).state) == h) {
              return;
            }
            auto call = id(termo_timer_stop_hour).make_call();
            call.set_value(h);
            call.perform();

select:
  # Según tus pruebas:
  #  - 2 = STD
  #  - 1 = TIMER
  #  - 0 = SMART
  - platform: tuya
    name: "Modo"
    id: termo_mode
    enum_datapoint: 4
    optimistic: false
    options:
      0: SMART
      1: TIMER
      2: STD

number:
  #  - DP102 = hora de inicio en modo TIMER
  #  - DP103 = hora de fin en modo TIMER
  - platform: tuya
    name: "Timer inicio (hora)"
    id: termo_timer_start_hour
    number_datapoint: 102
    internal: true
    min_value: 0
    max_value: 23
    step: 1
    entity_category: config
    on_value:
      then:
        - lambda: |-
            int h = (int) roundf(x);
            if (h < 0) h = 0;
            if (h > 23) h = 23;

            auto current = id(termo_timer_start_time).state_as_esptime();
            if (current.hour == h && current.minute == 0 && current.second == 0) {
              return;
            }
            char buf[9];
            snprintf(buf, sizeof(buf), "%02d:00:00", h);
            auto dt_call = id(termo_timer_start_time).make_call();
            dt_call.set_time(buf);
            dt_call.perform();
  - platform: tuya
    name: "Timer fin (hora)"
    id: termo_timer_stop_hour
    number_datapoint: 103
    internal: true
    min_value: 0
    max_value: 23
    step: 1
    entity_category: config
    on_value:
      then:
        - lambda: |-
            int h = (int) roundf(x);
            if (h < 0) h = 0;
            if (h > 23) h = 23;

            auto current = id(termo_timer_stop_time).state_as_esptime();
            if (current.hour == h && current.minute == 0 && current.second == 0) {
              return;
            }
            char buf[9];
            snprintf(buf, sizeof(buf), "%02d:00:00", h);
            auto dt_call = id(termo_timer_stop_time).make_call();
            dt_call.set_time(buf);
            dt_call.perform();

binary_sensor:
  - platform: tuya
    name: "Unknown 104"
    id: termo_dp_104
    sensor_datapoint: 104

  - platform: tuya
    name: "Fault Flags"
    id: termo_fault_flags
    sensor_datapoint: 9
