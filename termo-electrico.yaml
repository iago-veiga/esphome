substitutions:
  device_name: termo-electrico

packages:
  device_base: !include base_devices/esp12f.yaml
  logger_tuya: !include common/logger_tuya_warn.yaml

esphome:
  friendly_name: Termo
  comment: Control ESP8266 con MCU Tuya del termo eléctrico.
  area: cocina

uart:
  tx_pin: GPIO1
  rx_pin: GPIO3
  baud_rate: 9600
  id: uart_bus
  rx_buffer_size: 256

globals:
  - id: last_dp101
    type: int
    restore_value: no
    initial_value: "-1"

tuya:
  time_id: sntp_time
  on_datapoint_update:
    - sensor_datapoint: 101
      datapoint_type: enum
      then:
        - lambda: |-
            if (id(last_dp101) != (int) x) {
              id(last_dp101) = (int) x;
              ESP_LOGW("termo_dp", "DP101 (enum) -> %d", (int) x);
            }
            id(termo_dp_101_raw).publish_state(x);

switch:
  - platform: tuya
    id: termo_power
    switch_datapoint: 1
    internal: true

water_heater:
  - platform: template
    id: termo
    name: Termo
    icon: mdi:water-boiler
    current_temperature: !lambda "return id(termo_current_temperature).state;"
    target_temperature: !lambda "return id(termo_target_temperature).state;"
    is_on: !lambda "return id(termo_power).state;"
    mode: !lambda |-
      if (!id(termo_power).state) {
        return water_heater::WATER_HEATER_MODE_OFF;
      }

      if (id(termo_mode).current_option() == "SMART") {
        return water_heater::WATER_HEATER_MODE_ECO;
      }
      return water_heater::WATER_HEATER_MODE_ELECTRIC;
    supported_modes:
      - "OFF"
      - ECO
      - ELECTRIC
    visual:
      min_temperature: 30
      max_temperature: 75
      target_temperature_step: 1
    set_action:
      - lambda: |-
          if (id(termo).is_on()) {
            id(termo_power).turn_on();
          } else {
            id(termo_power).turn_off();
          }

          if (id(termo).is_on()) {
            auto mode_call = id(termo_mode).make_call();
            if (id(termo).get_mode() == water_heater::WATER_HEATER_MODE_ECO) {
              mode_call.set_option("SMART");
            } else {
              mode_call.set_option("STD");
            }
            mode_call.perform();
          }

          auto temp_call = id(termo_target_temperature).make_call();
          temp_call.set_value(id(termo).get_target_temperature());
          temp_call.perform();

sensor:
  - platform: tuya
    id: termo_current_temperature
    sensor_datapoint: 3
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    internal: true

  # DP101 resulta ser enum (según logs), así que usamos template para evitar warnings.
  - platform: template
    name: "DP101 raw"
    id: termo_dp_101_raw
    accuracy_decimals: 0
    update_interval: never
    entity_category: diagnostic
    disabled_by_default: true

select:
  # Según tus pruebas:
  #  - 2 = STD
  #  - 1 = TIMER
  #  - 0 = SMART
  - platform: tuya
    name: "Modo"
    id: termo_mode
    enum_datapoint: 4
    optimistic: false
    options:
      0: SMART
      1: TIMER
      2: STD

number:
  - platform: tuya
    id: termo_target_temperature
    number_datapoint: 2
    min_value: 30
    max_value: 75
    step: 1
    unit_of_measurement: "°C"
    device_class: temperature
    internal: true

binary_sensor:
  - platform: tuya
    name: "DP104 raw"
    id: termo_dp_104
    sensor_datapoint: 104
    entity_category: diagnostic
    disabled_by_default: true
    on_press:
      then:
        - lambda: |-
            ESP_LOGW("termo_dp", "DP104 -> ON");
    on_release:
      then:
        - lambda: |-
            ESP_LOGW("termo_dp", "DP104 -> OFF");

  - platform: tuya
    name: "DP9 Fault Flags"
    id: termo_fault_flags
    sensor_datapoint: 9
    entity_category: diagnostic
    disabled_by_default: true
