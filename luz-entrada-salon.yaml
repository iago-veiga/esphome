substitutions:
  device_name: luz-entrada-salon

packages:
  device_base: !include base_devices/yeelight-light-ceiling10.yaml
  mqtt: !include common/mqtt.yaml

esphome:
  friendly_name: Luz entrada salon
  comment: Yeelight Ceiling Light 10 con control de luz principal y nocturna.
  area: salon
  on_boot: 
    then:
        - light.control:
            id: ceiling_light
            brightness: 80%
            color_temperature: 2700K

