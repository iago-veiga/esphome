packages:
  mqtt: !include ../mqtt.yaml

esphome:
  on_boot:
    priority: 600
    then:
      - output.turn_on: relay_1

binary_sensor:
  - id: !extend switch_1
    on_state:
      then:
        - mqtt.publish_json:
            topic: ${light_device_name}/light/luz/command
            payload: |-
              root["state"] = "TOGGLE";

switch:
  - platform: output
    name: AC
    output: relay_1
    restore_mode: ALWAYS_ON
