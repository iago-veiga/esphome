wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  min_auth_mode: WPA2

  # Roaming defaults (ESPHome 2026.1.0+): allow scanning and post-connect roaming.
  # This helps devices move between APs that share the same SSID.
  fast_connect: false
  post_connect_roaming: true
  enable_on_boot: true

  ap:
    ssid: ${device_name} AP
    password: !secret esphome_fallback_ap_password
  reboot_timeout: 12h
  # use_address: 192.168.10.XX
