  - platform: template
    name: "Modo Debug"
    id: switch_debug
    icon: mdi:bug
    optimistic: true
    restore_mode: ALWAYS_OFF
    turn_on_action:
      - logger.set_level: DEBUG
      - logger.log: "Log level changed to DEBUG"
    turn_off_action:
      - logger.set_level: INFO
      - logger.log: "Log level changed to INFO"