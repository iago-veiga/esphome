substitutions:
  device_name: arenero-gato

packages:
  device_base: !include base_devices/esp12f.yaml
  logger_tuya_debug: !include common/logger_tuya_debug.yaml

esphome:
  friendly_name: Arenero gatos
  area: bano_pasillo


uart:
  rx_pin: GPIO3
  tx_pin: GPIO1
  baud_rate: 115200

tuya:
  time_id: sntp_time
  on_datapoint_update:
    # DPs no identificados - posiblemente horarios/configuración compleja
    - sensor_datapoint: 1
      datapoint_type: raw
      then:
        - lambda: |-
            std::string hex;
            for (uint8_t b : x) {
              char buf[3];
              snprintf(buf, sizeof(buf), "%02X", b);
              hex += buf;
            }
            ESP_LOGI("arenero", "DP1 (RAW - posible horarios): %s (%d bytes)", hex.c_str(), x.size());
    
    - sensor_datapoint: 2
      datapoint_type: raw
      then:
        - lambda: |-
            std::string hex;
            for (uint8_t b : x) {
              char buf[3];
              snprintf(buf, sizeof(buf), "%02X", b);
              hex += buf;
            }
            ESP_LOGI("arenero", "DP2 (RAW - posible config): %s (%d bytes)", hex.c_str(), x.size());
    
    # Estados del sistema
    - sensor_datapoint: 9
      datapoint_type: enum
      then:
        - logger.log:
            format: "DP9 (enum - estado general): %d"
            args: ['x']
    
    - sensor_datapoint: 10
      datapoint_type: enum
      then:
        - logger.log:
            format: "DP10 (enum - fault/error): %d"
            args: ['x']
    
    # Bitmasks descubiertos
    - sensor_datapoint: 21
      datapoint_type: bitmask
      then:
        - lambda: |-
            ESP_LOGI("arenero", "DP21 (bitmask - flags sistema): 0x%08X", x);
    
    - sensor_datapoint: 22
      datapoint_type: bitmask
      then:
        - lambda: |-
            ESP_LOGI("arenero", "DP22 (bitmask - config flags): 0x%08X", x);
    
    # Enum 24 - valor especial 255
    - sensor_datapoint: 24
      datapoint_type: enum
      then:
        - logger.log:
            format: "DP24 (enum - modo especial): %d"
            args: ['x']
    
    # Enteros no mapeados
    - sensor_datapoint: 109
      datapoint_type: int
      then:
        - logger.log:
            format: "DP109 (int - temporizador?): %d"
            args: ['x']
    
    - sensor_datapoint: 110
      datapoint_type: int
      then:
        - logger.log:
            format: "DP110 (int - contador?): %d"
            args: ['x']
    
    # Switches no identificados
    - sensor_datapoint: 112
      datapoint_type: bool
      then:
        - logger.log:
            format: "DP112 (bool - función?): %s"
            args: ['x ? "ON" : "OFF"']
    
    - sensor_datapoint: 113
      datapoint_type: enum
      then:
        - logger.log:
            format: "DP113 (enum - modo?): %d"
            args: ['x']
    
    - sensor_datapoint: 119
      datapoint_type: bool
      then:
        - logger.log:
            format: "DP119 (bool - nueva función?): %s"
            args: ['x ? "ON" : "OFF"']


# ========================================
# CONTROLES DE LIMPIEZA
# ========================================
switch:
  - platform: tuya
    name: Limpiar
    id: start
    icon: mdi:broom
    switch_datapoint: 3

  - platform: tuya
    name: Limpieza automática
    icon: mdi:robot-vacuum
    id: auto_clean
    switch_datapoint: 4

  - platform: tuya
    name: Cambiar arena
    id: replace_litter
    icon: mdi:autorenew
    switch_datapoint: 111

  - platform: tuya
    name: Cambiar bolsa
    id: replace_bag
    icon: mdi:delete-empty
    switch_datapoint: 117

# ========================================
# DEODORIZACIÓN
# ========================================
  - platform: tuya
    name: Deodorizador
    id: deodorization
    icon: mdi:leaf
    switch_datapoint: 17

# ========================================
# CONFIGURACIÓN Y MANTENIMIENTO
# ========================================
  - platform: tuya
    name: Bloqueo infantil
    id: child_lock
    icon: mdi:lock
    entity_category: config
    switch_datapoint: 103

  - platform: tuya
    name: Infrarrojo
    id: infrared
    icon: mdi:motion-sensor
    entity_category: config
    switch_datapoint: 104

  - platform: tuya
    name: Luz panel
    id: panel_light
    icon: mdi:lightbulb
    inverted: true
    entity_category: config
    switch_datapoint: 106

  - platform: tuya
    name: Inicilizar arenero
    id: initialize_litter_box
    icon: mdi:restart
    entity_category: config
    switch_datapoint: 115

  - platform: tuya
    name: Calibrar peso
    id: calibrate_weight
    icon: mdi:scale-balance
    entity_category: config
    switch_datapoint: 118

# ========================================
# TEMPORIZADORES Y CONFIGURACIÓN
# ========================================
number:
  - platform: tuya
    name: Tiempo para comenzar la limpieza
    id: delay_clean_time
    icon: mdi:clock-start
    entity_category: config
    number_datapoint: 5
    min_value: 0
    max_value: 60
    step: 1
    unit_of_measurement: 'min'

  - platform: tuya
    name: Intervalo entre limpiezas
    id: cleaning_interval
    number_datapoint: 105
    min_value: 0
    max_value: 120
    icon: mdi:timelapse
    entity_category: config
    step: 1
    unit_of_measurement: 'min'

  - platform: tuya
    name: Umbral de bolsa llena
    id: full_bag_threshold
    number_datapoint: 114
    min_value: 0
    max_value: 15
    entity_category: config
    step: 1

# ========================================
# SENSORES DE USO Y ACTIVIDAD
# ========================================
sensor:
  - platform: tuya
    name: Peso gato
    unit_of_measurement: 'g'
    icon: mdi:scale
    device_class: weight
    id: cat_weight
    sensor_datapoint: 6
    on_value:
      then:
        - lambda: |-
            if (id(cat_weight).state >= 5001 && id(cat_weight).state <= 8000) {
              return id(weight_cat1).publish_state(x);}
            else if (id(cat_weight).state >= 3500 && id(cat_weight).state <= 5000) {
              return id(weight_cat2).publish_state(x);}

  - platform: tuya
    name: Excreciones del dia
    id: excretion_times_day
    unit_of_measurement: 'veces'
    icon: mdi:counter
    state_class: total_increasing
    sensor_datapoint: 7

  - platform: tuya
    name: Tiempo ultima excreccion
    unit_of_measurement: 's'
    icon: mdi:clock-time-four-outline
    device_class: duration
    state_class: measurement
    id: excretion_time
    sensor_datapoint: 8

# ========================================
# SENSORES AMBIENTALES
# ========================================
  - platform: tuya
    name: Temperatura
    id: temperature
    unit_of_measurement: '°C'
    icon: mdi:thermometer
    device_class: temperature
    state_class: measurement
    entity_category: diagnostic
    sensor_datapoint: 101

  - platform: tuya
    name: Humedad
    id: humidity
    unit_of_measurement: '%'
    icon: mdi:water-percent
    device_class: humidity
    state_class: measurement
    entity_category: diagnostic
    sensor_datapoint: 102

# ========================================
# PESO EN TIEMPO REAL
# ========================================
  - platform: tuya
    name: Peso en tiempo real
    unit_of_measurement: 'g'
    icon: mdi:scale
    device_class: weight
    id: real_time_weight
    sensor_datapoint: 116

# ========================================
# SENSORES POR GATO (TEMPLATE)
# ========================================
  - platform: template
    name: Peso Simba
    id: weight_cat1
    unit_of_measurement: 'g'
    device_class: weight
    icon: mdi:weight-kilogram

  - platform: template
    name: Peso Fada
    id: weight_cat2
    unit_of_measurement: 'g'
    device_class: weight
    icon: mdi:weight-kilogram

# ========================================
# SENSORES DE ESTADO Y DIAGNÓSTICO
# ========================================
text_sensor:
  - platform: tuya
    name: Estado DP9
    id: dp9_state
    sensor_datapoint: 9
    entity_category: diagnostic
    disabled_by_default: true

  - platform: tuya
    name: Fault DP10
    id: dp10_fault
    sensor_datapoint: 10
    entity_category: diagnostic
    disabled_by_default: true

binary_sensor:
  - platform: template
    name: Bolsa llena
    id: bag_full
    device_class: problem
    icon: mdi:delete-alert