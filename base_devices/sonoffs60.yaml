---
esphome:
  name: ${device_name}

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: esp-idf

status_led:
    pin:
      number: GPIO5
      inverted: true

packages:
  api: !include ../common/api.yaml
  wifi: !include ../common/wifi.yaml
  ota: !include ../common/ota.yaml
  logger: !include ../common/logger.yaml
  web_server: !include ../common/web_server.yaml
  captive_portal: !include ../common/captive_portal.yaml
  syslog: !include ../common/syslog.yaml

time:
  - <<: !include ../common/time/sntp.yaml

sensor:
  - <<: !include ../common/sensor/wifi_signal.yaml
  - platform: cse7766
    voltage:
      name: Voltaje
      filters:
        - throttle_average: 10s
    current:
      name: Intensidad
      filters:
        - throttle_average: 10s
    power:
      name: Potencia
      filters:
        - throttle_average: 10s
    energy:
      name: Actor potencia
      filters:
        - throttle_average: 10s
        - delta: 0.001
    apparent_power:
      name: "Sonoff Pow R2 Apparent Power"
      filters:
        - throttle_average: 10s
    reactive_power:
      name: "Sonoff Pow R2 Reactive Power"
      filters:
        - throttle_average: 10s
    power_factor:
      name: "Sonoff Pow R2 Power Factor"
      filters:
        - throttle_average: 10s

text_sensor:
  - <<: !include ../common/text_sensor/wifi_info.yaml

button:
  - <<: !include ../common/button/restart.yaml

select:
  - <<: !include ../common/select/select_logger.yaml

switch:
  - id: switch_1
    platform: gpio
    name: Enchufe
    pin: GPIO4
    restore_mode: ALWAYS_ON

uart:
  rx_pin: GPIO7
  baud_rate: 4800
  parity: EVEN

binary_sensor:
  - platform: gpio
    id: button_1
    internal: true
    pin:
      number: GPIO9
      ignore_strapping_warning: true
    on_press:
      - switch.toggle: switch_1
    filters:
      - delayed_on: 10ms
      - delayed_off: 10ms