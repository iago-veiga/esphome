---
esphome:
  name: ${device_name}

esp8266:
  board: esp01_1m

status_led:
  pin:
    number: GPIO13
    inverted: true

packages:
  api: !include ../common/api.yaml
  wifi: !include ../common/wifi.yaml
  ota: !include ../common/ota.yaml
  logger: !include ../common/logger.yaml
  web_server: !include ../common/web_server.yaml
  captive_portal: !include ../common/captive_portal.yaml
  syslog: !include ../common/syslog.yaml

sensor:
  - <<: !include ../common/sensor/wifi_signal.yaml
  - platform: hlw8012
    current_resistor: ${current_resistor}
    voltage_divider: ${voltage_divider}
    model: BL0937
    sel_pin:
      number: GPIO12
      inverted: true
    cf_pin: GPIO04
    cf1_pin: GPIO05
    current:
      name: Intensidad
      filters:
        - multiply: ${current_multiply}
    voltage:
      name: Voltaje
    power:
      name: Potencia
    energy:
      name: Actor potencia
    update_interval: 10s
    change_mode_every: 3

text_sensor:
  - <<: !include ../common/text_sensor/wifi_info.yaml

button:
  - <<: !include ../common/button/restart.yaml

time:
  - <<: !include ../common/time/sntp.yaml

output:
  - id: relay_1
    platform: gpio
    pin:
      number: GPIO03
      inverted: true

select:
  - <<: !include ../common/select/select_logger.yaml

switch:
  - id: switch_1
    platform: gpio
    name: Enchufe
    pin: GPIO14
    on_turn_on:
      - output.turn_on: relay_1
    on_turn_off:
      - output.turn_off: relay_1
    restore_mode: ALWAYS_ON
    
binary_sensor:
  - platform: gpio
    id: button_1
    internal: true
    pin:
      number: GPIO01
    on_press:
      - switch.toggle: switch_1
    filters:
      - delayed_on: 10ms
      - delayed_off: 10ms

light:
  - platform: binary
    internal: true
    name: "Relay Status"
    output: relay_1
