---
esphome:
  name: ${device_name}
  on_boot:
    priority: -100
    then:
      - if:
          condition:
            switch.is_on: relay_1
          then:
            - output.turn_on: wifi_led
          else:
            - output.turn_off: wifi_led

esp32:
  board: esp32dev
  framework:
    type: esp-idf

# POWR320D (Sonoff POW Elite 20A) pinout:
# - Button:      GPIO00 (active-low)
# - Relay ON:    GPIO02 (biestable, pulso 500ms)
# - Relay OFF:   GPIO04 (biestable, pulso 500ms)
# - WiFi LED:    GPIO05 (active-low) → indica estado del relé
# - TM1621 DA:   GPIO14
# - CSE7766 RX:  GPIO16 (4800 8E1)
# - Status LED:  GPIO18 (active-low) → indica estado ESPHome
# - TM1621 CS:   GPIO25
# - TM1621 RD:   GPIO26
# - TM1621 WR:   GPIO27

uart:
  rx_pin: GPIO16
  baud_rate: 4800
  parity: EVEN

status_led:
  pin:
    number: GPIO18
    inverted: true

packages:
  api: !include ../common/api.yaml
  wifi: !include ../common/wifi.yaml
  ota: !include ../common/ota.yaml
  logger: !include ../common/logger.yaml
  web_server: !include ../common/web_server.yaml
  captive_portal: !include ../common/captive_portal.yaml
  syslog: !include ../common/syslog.yaml

time:
  - <<: !include ../common/time/sntp.yaml

globals:
  - id: display_page
    type: bool
    restore_value: no
    initial_value: 'true'

sensor:
  - <<: !include ../common/sensor/wifi_signal.yaml

  - platform: cse7766
    voltage:
      name: Voltaje
      id: v_sensor
      filters:
        - throttle_average: 10s
    current:
      name: Intensidad
      id: a_sensor
      filters:
        - throttle_average: 10s
    power:
      name: Potencia
      id: w_sensor
      filters:
        - throttle_average: 10s
    energy:
      name: Energía
      filters:
        - throttle_average: 10s

  - platform: total_daily_energy
    name: Energía diaria
    id: daily_energy
    power_id: w_sensor
    unit_of_measurement: kWh
    device_class: energy
    state_class: total_increasing
    accuracy_decimals: 3
    filters:
      - multiply: 0.001

text_sensor:
  - <<: !include ../common/text_sensor/wifi_info.yaml

button:
  - platform: restart
    id: restart_button
    name: Reiniciar
    entity_category: config

select:
  - <<: !include ../common/select/select_logger.yaml

output:
  - platform: gpio
    id: relay_on_pin
    pin:
      number: GPIO02
      ignore_strapping_warning: true
  - platform: gpio
    id: relay_off_pin
    pin: GPIO04
  - platform: gpio
    id: wifi_led
    pin:
      number: GPIO05
      inverted: true

switch:
  - platform: template
    name: Relé
    id: relay_1
    restore_mode: RESTORE_DEFAULT_ON
    optimistic: true
    turn_on_action:
      - output.turn_on: relay_on_pin
      - delay: 500ms
      - output.turn_off: relay_on_pin
      - output.turn_on: wifi_led
    turn_off_action:
      - output.turn_on: relay_off_pin
      - delay: 500ms
      - output.turn_off: relay_off_pin
      - output.turn_off: wifi_led

display:
  - platform: tm1621
    id: tm1621_display
    cs_pin: GPIO25
    data_pin: GPIO14
    read_pin: GPIO26
    write_pin: GPIO27
    update_interval: 1s
    lambda: |-
      if (id(display_page)) {
        it.display_voltage(true);
        it.display_kwh(false);
        it.printf(0, "%.1f", id(v_sensor).state);
        it.printf(1, "%.3f", id(a_sensor).state);
      } else {
        it.display_voltage(false);
        it.display_kwh(true);
        it.printf(0, "%.2f", id(daily_energy).state);
        it.printf(1, "%.1f", id(w_sensor).state);
      }

binary_sensor:
  - platform: gpio
    id: button_1
    internal: true
    pin:
      number: GPIO00
      inverted: true
      ignore_strapping_warning: true
    filters:
      - delayed_off: 10ms
    on_click:
      - min_length: 50ms
        max_length: 350ms
        then:
          - switch.toggle: relay_1
      - min_length: 360ms
        max_length: 2900ms
        then:
          - lambda: |-
              id(display_page) = !id(display_page);
          - component.update: tm1621_display
      - min_length: 3s
        max_length: 10s
        then:
          - button.press: restart_button
