substitutions:
  device_name: fuente-gato

packages:
  device_base: !include base_devices/esp32c3.yaml

esphome:
  friendly_name: Fuente gatos
  area: cocina

uart:
  tx_pin: GPIO21
  rx_pin: GPIO20
  baud_rate: 9600

tuya:
  time_id: sntp_time
  on_datapoint_update:
    - sensor_datapoint: 9
      datapoint_type: enum
      then:
        - lambda: |-
            id(dp9_val) = x;
            ESP_LOGD("fuente_dp", "DP9 (water_level enum) -> %u", (unsigned)x);
        - script.execute: publish_derived_states

    - sensor_datapoint: 20
      datapoint_type: enum
      then:
        - lambda: |-
            id(dp20_val) = x;
            ESP_LOGD("fuente_dp", "DP20 (power_mode enum) -> %u", (unsigned)x);
        - script.execute: publish_derived_states

    - sensor_datapoint: 23
      datapoint_type: bitmask
      then:
        - lambda: |-
            uint32_t bitmask_value = x;
            id(bitmask_val) = bitmask_value;
            ESP_LOGD("fuente_dp", "DP23 (fault bitmask) -> %u (0x%08X)", bitmask_value, (unsigned) bitmask_value);
        - script.execute: publish_derived_states

script:
  - id: publish_derived_states
    mode: queued
    then:
      - lambda: |-
          // Publica entidades derivadas para evitar polling y mantener HA consistente.
          const uint32_t faults = id(bitmask_val);
          const bool lack_water = (faults & 0x01) != 0;
          const bool filter_replace = (faults & 0x02) != 0;
          const bool clean_remind = (faults & 0x04) != 0;
          const bool battery_power = (faults & 0x08) != 0;
          const bool pump_fault_0x10 = (faults & 0x10) != 0;
          const bool pump_fault_0x20 = (faults & 0x20) != 0;
          const bool pump_blocked = pump_fault_0x10 || pump_fault_0x20;

          // Raw (diagnóstico)
          id(dp9_raw).publish_state(id(dp9_val));
          id(dp20_raw).publish_state(id(dp20_val));
          char buf[24];
          snprintf(buf, sizeof(buf), "0x%08X", (unsigned) faults);
          id(dp23_raw).publish_state(buf);

          // Nivel de agua (DP9 solo parece reportar 1/2 en esta unidad)
          // - DP23 bit 0x01 es la señal más fiable de "sin agua".
          if (lack_water || id(dp9_val) == 1) {
            id(water_level).publish_state("Sin agua");
          } else if (id(dp9_val) == 2) {
            id(water_level).publish_state("Con agua");
          } else {
            id(water_level).publish_state("Desconocido");
          }

          // Modo de potencia (report-only)
          if (id(dp20_val) == 0) {
            id(power_mode).publish_state("Fuerte");
          } else if (id(dp20_val) == 1) {
            id(power_mode).publish_state("Inteligente");
          } else if (id(dp20_val) == 2) {
            id(power_mode).publish_state("Batería");
          } else {
            id(power_mode).publish_state("Desconocido");
          }

          // Binarios de fallo
          id(problem).publish_state(faults != 0);
          id(fault_lack_water).publish_state(lack_water);
          id(fault_filter_replace).publish_state(filter_replace);
          id(fault_clean_remind).publish_state(clean_remind);
          id(fault_battery_power).publish_state(battery_power);
          id(fault_pump_blocked).publish_state(pump_blocked);
          id(fault_pump_0x10).publish_state(pump_fault_0x10);
          id(fault_pump_0x20).publish_state(pump_fault_0x20);

          // Texto de fallo (resumen)
          if (faults == 0) {
            id(fault_text).publish_state("Sin fallos");
            return;
          }
          std::string out;
          auto add = [&](const char *s) {
            if (!out.empty()) out += ", ";
            out += s;
          };
          if (lack_water) add("Falta agua");
          if (filter_replace) add("Cambiar filtro");
          if (clean_remind) add("Recordatorio limpieza");
          if (battery_power) add("Modo batería");
          if (pump_blocked) add("Fallo bomba");

          // Bits desconocidos
          uint32_t known = 0;
          known |= 0x01;
          known |= 0x02;
          known |= 0x04;
          known |= 0x08;
          known |= 0x10;
          known |= 0x20;
          uint32_t unknown = faults & ~known;
          if (unknown != 0) {
            char ubuf[32];
            snprintf(ubuf, sizeof(ubuf), "unknown_0x%08X", (unsigned) unknown);
            add(ubuf);
          }
          id(fault_text).publish_state(out.c_str());

switch:
  - platform: tuya
    name: Fuente
    id: fountain
    switch_datapoint: 1
  - platform: tuya
    id: filter_reset
    switch_datapoint: 5
    internal: true
  - platform: tuya
    id: pump_reset
    switch_datapoint: 6
    internal: true
  - platform: tuya
    id: smart_mode
    switch_datapoint: 102
    internal: true

light:
  - platform: tuya
    name: Led
    switch_datapoint: 101
    restore_mode: RESTORE_DEFAULT_ON

select:
  - platform: tuya
    enum_datapoint: 2
    optimistic: true
    id: fountain_mode
    options:
      0: Continue
      1: Intermitent
    internal: true
  - platform: template
    name: Modo
    id: mode_select
    icon: mdi:fountain
    options:
      - Apagado
      - Continuo
      - Intermitente
      - Inteligente
    update_interval: 1s
    lambda: |-
      if (!id(fountain).state) {
        return {"Apagado"};
      } else if (id(fountain_mode).active_index() == 0 && !id(smart_mode).state) {
        return {"Continuo"};
      } else if (id(fountain_mode).active_index() == 1 && !id(smart_mode).state) {
        return {"Intermitente"};
      } else if (id(smart_mode).state) {
        return {"Inteligente"};
      } else {
        return {"Apagado"};
      }
    set_action:
      - lambda: |-
          if (x == "Apagado") {
            id(fountain).turn_off();
          } else if (x == "Continuo") {
            id(fountain).turn_on();
            id(smart_mode).turn_off();
            id(fountain_mode).make_call().set_index(0).perform();
          } else if (x == "Intermitente") {
            id(fountain).turn_on();
            id(smart_mode).turn_off();
            id(fountain_mode).make_call().set_index(1).perform();
          } else if (x == "Inteligente") {
            id(fountain).turn_on();
            id(smart_mode).turn_on();
          }

sensor:
  - platform: tuya
    name: Filtro restante (días)
    id: filter_days
    sensor_datapoint: 3
    unit_of_measurement: d
    icon: mdi:air-filter
  - platform: tuya
    name: Limpieza restante (días)
    id: pump_time
    sensor_datapoint: 4
    unit_of_measurement: d
    icon: mdi:broom

  # Valores "raw" detectados en logs (útil para descubrir DPs sin suposiciones)
  - platform: template
    name: DP9 raw
    id: dp9_raw
    accuracy_decimals: 0
    update_interval: never
    entity_category: diagnostic
    disabled_by_default: true
    internal: true
    lambda: |-
      return {};

  - platform: template
    name: DP20 raw
    id: dp20_raw
    accuracy_decimals: 0
    update_interval: never
    entity_category: diagnostic
    disabled_by_default: true
    internal: true
    lambda: |-
      return {};

text_sensor:
  - platform: template
    name: Nivel de agua
    id: water_level
    icon: mdi:water

  - platform: template
    name: Modo de potencia
    id: power_mode
    icon: mdi:flash
    entity_category: diagnostic

  - platform: template
    name: Fallo
    id: fault_text
    icon: mdi:alert-circle
    entity_category: diagnostic

  - platform: template
    name: DP23 raw
    id: dp23_raw
    update_interval: never
    entity_category: diagnostic
    disabled_by_default: true
    internal: true
    lambda: |-
      return {""};

number:
  - platform: tuya
    name: Vida filtro (días)
    id: filter_life
    icon: mdi:air-filter
    entity_category: config
    min_value: 0
    step: 1
    max_value: 90
    number_datapoint: 7
  - platform: tuya
    name: Vida limpieza (días)
    id: time_clean
    icon: mdi:broom
    entity_category: config
    step: 1
    min_value: 0
    max_value: 31
    number_datapoint: 8

button:
  - platform: template
    name: Restablecer Filtro
    icon: mdi:air-filter
    entity_category: config
    on_press:
      then:
        - switch.turn_on: filter_reset
  - platform: template
    name: Restablecer limpieza
    icon: mdi:broom
    entity_category: config
    on_press:
      then:
        - switch.turn_on: pump_reset

binary_sensor:
  - platform: template
    name: Error General
    id: problem
    device_class: problem
    lambda: |-
      return {};

  - platform: template
    name: Falta agua
    id: fault_lack_water
    device_class: problem
    lambda: |-
      return {};

  - platform: template
    name: Cambiar filtro
    id: fault_filter_replace
    device_class: problem
    lambda: |-
      return {};

  - platform: template
    name: Recordatorio limpieza
    id: fault_clean_remind
    device_class: problem
    lambda: |-
      return {};

  - platform: template
    name: Modo batería
    id: fault_battery_power
    device_class: problem
    lambda: |-
      return {};

  - platform: template
    name: Bomba bloqueada
    id: fault_pump_blocked
    device_class: problem
    lambda: |-
      return {};

  - platform: template
    name: Fallo bomba (0x10)
    id: fault_pump_0x10
    entity_category: diagnostic
    disabled_by_default: true
    internal: true
    device_class: problem
    lambda: |-
      return {};

  - platform: template
    name: Fallo bomba (0x20)
    id: fault_pump_0x20
    entity_category: diagnostic
    disabled_by_default: true
    internal: true
    device_class: problem
    lambda: |-
      return {};

globals:
  - id: bitmask_val
    type: uint32_t
    restore_value: no
    initial_value: '0'

  - id: dp9_val
    type: uint8_t
    restore_value: no
    initial_value: '255'

  - id: dp20_val
    type: uint8_t
    restore_value: no
    initial_value: '255'