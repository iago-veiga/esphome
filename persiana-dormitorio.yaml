substitutions:
  device_name: persiana-dormitorio

packages:
  device_base: !include base_devices/sonoffdualr3.yaml

esphome:
  friendly_name: Persiana dormitorio
  area: dormitorio

cover:
  - platform: current_based
    name: Persiana
    id: cover_1

    open_sensor: current_2
    open_moving_current_threshold: 0.5
    open_obstacle_current_threshold: 1.0
    open_duration: 30s
    open_action:
      - switch.turn_on: relay_2

    close_sensor: current_1
    close_moving_current_threshold: 0.5
    close_obstacle_current_threshold: 1.0
    close_duration: 30s
    close_action:
      - switch.turn_on: relay_1

    stop_action:
      - switch.turn_off: relay_2
      - switch.turn_off: relay_1

    start_sensing_delay: 1.5s
    max_duration: 45s
    obstacle_rollback: 0%
    malfunction_detection: true

script:
  - id: wall_switch_action
    mode: restart
    then:
      - delay: 150ms
      - if:
          condition:
            and:
              - binary_sensor.is_on: switch_1
              - binary_sensor.is_off: switch_2
          then:
            - cover.close: cover_1
          else:
            - if:
                condition:
                  and:
                    - binary_sensor.is_off: switch_1
                    - binary_sensor.is_on: switch_2
                then:
                  - cover.open: cover_1
                else:
                  - cover.stop: cover_1

binary_sensor:
  - id: !extend switch_1
    filters:
      - delayed_on_off: 100ms
    on_state:
      then:
        - script.execute: wall_switch_action
  - id: !extend switch_2
    filters:
      - delayed_on_off: 100ms
    on_state:
      then:
        - script.execute: wall_switch_action
